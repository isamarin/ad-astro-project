# Local MediaMTX only. Camera adapters ship their own stack
# (see https://github.com/lumina-stream/canon-adapter).
services:
  mediamtx:
    image: bluenviron/mediamtx:1
    container_name: mediamtx
    restart: unless-stopped
    ports:
      - "8554:8554"
      - "8889:8889"
      - "8890:8890/udp"
      - "9997:9997"
