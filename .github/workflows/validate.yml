name: Validate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  svelte:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter desktop build
      - run: pnpm --filter desktop check
