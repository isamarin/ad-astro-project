stages:
  - build
  - package
  - release

# --- Frontend validation (SvelteKit static build) ---
build:
  stage: build
  image: node:22-slim
  variables:
    CI: "true"
  before_script:
    - corepack enable && corepack prepare pnpm@10 --activate
    - pnpm config set store-dir .pnpm-store
    - pnpm install --frozen-lockfile
  script:
    - pnpm --filter desktop build
  cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths:
      - .pnpm-store/
      - node_modules/

# --- Package camera agent for Orange Pi (ARMv7) ---
.package-qemu:
  stage: package
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: ""
    DOCKER_HOST: tcp://docker:2375
    UPLOAD_API_URL: http://gitlab:80/api/v4
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
  before_script:
    - apk add --no-cache curl
    - docker run --rm --privileged tonistiigi/binfmt --install all
    - docker buildx create --name cibuilder --use
    - docker buildx inspect --bootstrap

package:camera:armv7:
  extends: .package-qemu
  script:
    - export APP_VER="${CI_COMMIT_TAG#v}"
    - |
      docker buildx build \
        --platform linux/arm/v7 \
        --build-arg APP_VERSION=${APP_VER} \
        -t astrostreamer/camera:${APP_VER}-armv7 \
        --output type=docker,dest=camera-armv7.tar \
        ./services/camera
    - |
      curl --fail --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
        --upload-file camera-armv7.tar \
        "${UPLOAD_API_URL}/projects/${CI_PROJECT_ID}/packages/generic/astrostreamer/${APP_VER}/camera-armv7.tar"

create-release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs:
    - package:camera:armv7
  variables:
    CI_API_V4_URL: http://gitlab:80/api/v4
    CI_SERVER_URL: http://gitlab:80
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
  script:
    - export APP_VER="${CI_COMMIT_TAG#v}"
    - export PKG_URL="https://gitlab.igrsxyz.keenetic.pro/api/v4/projects/${CI_PROJECT_ID}/packages/generic/astrostreamer/${APP_VER}"
    - export NOTES=$(awk "/^## \[${APP_VER}\]/{found=1; next} /^## \[/{if(found) exit} found" CHANGELOG.md)
    - |
      release-cli create \
        --name "AstroStreamer v${APP_VER}" \
        --tag-name "${CI_COMMIT_TAG}" \
        --description "${NOTES:-Release ${APP_VER}}" \
        --assets-link "{\"name\":\"camera-armv7.tar\",\"url\":\"${PKG_URL}/camera-armv7.tar\",\"link_type\":\"package\"}"
